[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omle-spark"
dynamic = ["version"]
description = "PySpark wrapper for OMLE model scoring"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["omle*"]

[tool.setuptools_scm]
# Two levels down from the git root (spark/python/), so point upward twice.
root = "../.."
version_file = "omle/_version.py"
