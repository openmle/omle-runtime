name: Tests

# Everything here is downstream of the C++ runtime, so every job builds it
# first. The dependency chain is:
#
#   C++ (libomleruntime — one shared library, C++ API + C ABI)
#     ├── omleruntime   (Python, scikit-build-core)
#     ├── Java          (JNA → libomleruntime)     → omle-runtime.jar
#     │     └── Scala   (reads the Java jar)       → omle-spark.jar
#     │           └── omle-spark (PySpark, needs both jars + libomleruntime)
#
# The proto lives in the sibling `omle` repository, and CMake reads it at
# ../omle/protobuf/omle.proto, so every job checks that repo out alongside this
# one. `path:` keeps the two as siblings inside the workspace.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: omle-runtime

jobs:
  # ---------------------------------------------------------------------------
  # 0. Portability lint — seconds, and it fails before the Windows matrix has
  #    finished installing a toolchain. MSVC rejects several GNU-only spellings
  #    (__restrict__, __builtin_*) that GCC and Clang accept silently, so
  #    without this the only signal is a red Windows build ten minutes in.
  # ---------------------------------------------------------------------------
  portability:
    name: Portability lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
      - run: python3 scripts/check_portability.py .

  # ---------------------------------------------------------------------------
  # 1. C++ — the runtime itself, on all three platforms.
  # ---------------------------------------------------------------------------
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle
          path: omle

      # CMakeLists requires Python3 Development.Module even for a pure C++
      # build, so a Python is always needed.
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install protobuf and GoogleTest (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libgtest-dev libabsl-dev

      - name: Install protobuf and GoogleTest (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf googletest abseil

      - name: Install protobuf and GoogleTest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # conda-forge publishes prebuilt Windows binaries, so nothing is
        # compiled here. vcpkg built protobuf and Abseil from source on every
        # run, which dominated the job; these are downloads.
        #
        # The packages ship a release-only CMake config
        # (protobuf-targets-release.cmake), protoc.exe, the import libraries and
        # the headers. libabseil is separate because libprotobuf does not vendor
        # it. Conda lays C libraries out under <prefix>/Library on Windows,
        # which is what CMAKE_PREFIX_PATH has to point at.
        run: |
          "$CONDA/Scripts/conda" create --yes --quiet \
            --prefix "${{ github.workspace }}/conda-deps" \
            -c conda-forge libprotobuf libabseil gtest

          # vcpkg copied dependent DLLs next to each binary automatically; conda
          # does not. libprotobuf.dll and the Abseil DLLs have to be findable at
          # run time by ctest, by the Python extension and by JNA, so put the
          # conda bin directory on PATH for every later step in this job.
          echo "${{ github.workspace }}/conda-deps/Library/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          # Release targets an explicit AVX2+FMA baseline on x86 rather than
          # -march=native, so what CI exercises is what a published wheel runs.
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/conda-deps/Library"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON $EXTRA

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        working-directory: omle-runtime/build
        run: ctest --output-on-failure --build-config Release

  # ---------------------------------------------------------------------------
  # 2. Python — omleruntime. Built from source by scikit-build-core, so it
  #    needs the same native toolchain as the C++ job.
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest and newest supported; the interpreters in between are covered
        # by the pure-Python repositories.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle
          path: omle

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libabsl-dev

      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf abseil

      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # conda-forge publishes prebuilt Windows binaries, so nothing is
        # compiled here. vcpkg built protobuf and Abseil from source on every
        # run, which dominated the job; these are downloads.
        #
        # The packages ship a release-only CMake config
        # (protobuf-targets-release.cmake), protoc.exe, the import libraries and
        # the headers. libabseil is separate because libprotobuf does not vendor
        # it. Conda lays C libraries out under <prefix>/Library on Windows,
        # which is what CMAKE_PREFIX_PATH has to point at.
        run: |
          "$CONDA/Scripts/conda" create --yes --quiet \
            --prefix "${{ github.workspace }}/conda-deps" \
            -c conda-forge libprotobuf libabseil

          # vcpkg copied dependent DLLs next to each binary automatically; conda
          # does not. libprotobuf.dll and the Abseil DLLs have to be findable at
          # run time by ctest, by the Python extension and by JNA, so put the
          # conda bin directory on PATH for every later step in this job.
          echo "${{ github.workspace }}/conda-deps/Library/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pybind11
          # The sibling omle package supplies the IR the fixtures are built
          # with; install it from the checkout rather than PyPI so the proto and
          # the runtime always agree.
          pip install ../omle

      - name: Build the extension in place
        shell: bash
        # tests/conftest.py puts python/ first on sys.path, so the suite imports
        # the source tree rather than an installed wheel. BUILD_PYTHON drops
        # omle_ext and libomleruntime straight into python/omleruntime/, which is
        # what that import needs.
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/conda-deps/Library"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=ON -DBUILD_TESTS=OFF \
            -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" $EXTRA
          cmake --build build --config Release --target omle_ext -j 4

      - name: Test
        working-directory: omle-runtime/python
        # test_ensemble_tree.py importorskips omle_convert, so the cross-repo
        # comparisons against xgboost/lightgbm/catboost skip here by design.
        run: pytest tests -q

      - name: Check the wheel builds and imports
        shell: bash
        run: |
          pip install ./python
          # Run from elsewhere so the source tree cannot satisfy the import.
          cd "$RUNNER_TEMP" && python -c "import omleruntime; print('wheel ok')"

  # ---------------------------------------------------------------------------
  # 3. Java — io.github.openmle.runtime. JNA loads libomleruntime at run time, so
  #    native library is built per platform and handed to the JVM explicitly.
  # ---------------------------------------------------------------------------
  java:
    name: Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle
          path: omle

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libabsl-dev

      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf abseil

      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # conda-forge publishes prebuilt Windows binaries, so nothing is
        # compiled here. vcpkg built protobuf and Abseil from source on every
        # run, which dominated the job; these are downloads.
        #
        # The packages ship a release-only CMake config
        # (protobuf-targets-release.cmake), protoc.exe, the import libraries and
        # the headers. libabseil is separate because libprotobuf does not vendor
        # it. Conda lays C libraries out under <prefix>/Library on Windows,
        # which is what CMAKE_PREFIX_PATH has to point at.
        run: |
          "$CONDA/Scripts/conda" create --yes --quiet \
            --prefix "${{ github.workspace }}/conda-deps" \
            -c conda-forge libprotobuf libabseil

          # vcpkg copied dependent DLLs next to each binary automatically; conda
          # does not. libprotobuf.dll and the Abseil DLLs have to be findable at
          # run time by ctest, by the Python extension and by JNA, so put the
          # conda bin directory on PATH for every later step in this job.
          echo "${{ github.workspace }}/conda-deps/Library/bin" >> "$GITHUB_PATH"

      - name: Build the shared runtime library
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/conda-deps/Library"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF $EXTRA
          cmake --build build --config Release --target omle_runtime -j 4

      - name: Test
        working-directory: omle-runtime/java
        shell: bash
        # The build drops the library next to the Python package; that
        # directory is what JNA has to search.
        run: mvn -B test -Djna.library.path="$GITHUB_WORKSPACE/omle-runtime/python/omleruntime"

  # ---------------------------------------------------------------------------
  # 4. Scala — io.github.openmle.spark. sbt reads java/target/omle-runtime.jar
  #    as an unmanaged jar, so Maven has to package before sbt compiles.
  #
  #    Windows is excluded: Spark needs a HADOOP_HOME with winutils.exe, which
  #    is more CI surface than the binding warrants.
  # ---------------------------------------------------------------------------
  scala:
    name: Scala (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle
          path: omle

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libabsl-dev

      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf abseil

      - name: Build the shared runtime library and the Java jar
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --target omle_runtime -j 4
          mvn -B -f java/pom.xml package -DskipTests

      - name: Test
        working-directory: omle-runtime/spark
        shell: bash
        run: |
          sbt -batch \
            "set Test/javaOptions += \"-Djna.library.path=$GITHUB_WORKSPACE/omle-runtime/python/omleruntime\"" \
            test

  # ---------------------------------------------------------------------------
  # 5. PySpark — omle-spark. Delegates to the Scala transformer, so it needs the
  #    whole chain: libomleruntime, the Java jar, and the packaged Scala jar.
  # ---------------------------------------------------------------------------
  pyspark:
    name: PySpark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle
          path: omle

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libabsl-dev

      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf abseil

      - name: Build the native library and both jars
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --target omle_runtime -j 4
          mvn -B -f java/pom.xml package -DskipTests
          # `sbt package` also resolves the JNA jar into the Coursier cache,
          # which spark/python/tests/conftest.py locates on the driver classpath.
          (cd spark && sbt -batch package)

      - name: Test
        working-directory: omle-runtime/spark/python
        shell: bash
        env:
          # Spark launches Python workers with PYSPARK_PYTHON; without this it
          # picks the system interpreter, which may be older than the driver's
          # and fails on modern PySpark syntax.
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark numpy
          pip install ../../../omle
          pip install .
          pytest tests -q
