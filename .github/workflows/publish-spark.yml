name: Publish omle-spark

# Publishes omle-spark (spark/python/) to PyPI.
#
# Pure Python, so one build serves every platform and interpreter — no
# compilation, no matrix. The JARs it drives are built and released separately
# by release.yml; this package is only the PySpark wrapper.
#
# fetch-depth: 0, because the version comes from git tags via setuptools-scm. A
# shallow clone yields a 0.1.dev1+g<sha> version, which is not what should be
# uploaded to an index.
#
# omle-runtime is published by publish-runtime.yml. They are separate files so
# that each PyPI project's Trusted Publisher can name one workflow and grant
# upload rights to that project alone.

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  push:
    tags: ["v*"]

jobs:
  # ---------------------------------------------------------------------------
  # 0. The fat omle-runtime jar, with native libraries for every platform.
  #    Shared with release.yml so both publish paths ship the same binary.
  # ---------------------------------------------------------------------------
  runtime-jar:
    uses: ./.github/workflows/build-jar.yml

  # ---------------------------------------------------------------------------
  # 1. Build the sdist and the universal wheel.
  #
  #    The wheel bundles four jars — omle-spark for both Scala versions, the
  #    fat omle-runtime jar and JNA — so `pip install omle-spark` needs no sbt
  #    and no -Djna.library.path. See spark/scripts/stage_jars.py.
  # ---------------------------------------------------------------------------
  dist:
    name: sdist + wheel
    needs: runtime-jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-runtime
          fetch-depth: 0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - uses: actions/download-artifact@v4
        with:
          name: omle-runtime-jar
          path: omle-runtime/java/target

      - name: Cross-build the Scala transformer
        working-directory: omle-runtime/spark
        # After the download, not before: build.sbt picks the omle-runtime jar
        # out of java/target as an unmanaged dependency, and the Scala source
        # imports io.github.openmle.runtime from it. Compiling first fails with
        # "object runtime is not a member of package io.github.openmle".
        #
        # Both Scala versions: PyPI ships Spark 3.x built against 2.12 and 4.x
        # against 2.13, and a wheel carrying only one fails on the other with
        # `'JavaPackage' object is not callable`, which names no cause.
        run: sbt +package

      - name: Resolve JNA
        working-directory: omle-runtime/java
        # `spark.jars` puts bare jars on the classpath and resolves nothing
        # transitively, so JNA — omle-runtime's only runtime dependency — has to
        # be shipped alongside it or the first call raises
        # NoClassDefFoundError: com/sun/jna/Library.
        run: mvn -q dependency:copy-dependencies -DoutputDirectory=target/deps

      - name: Stage the jars into the package
        working-directory: omle-runtime
        # --require-natives fails the build if the runtime jar has no native
        # library for a platform: such a wheel installs and imports fine and
        # only breaks at transform time, on whichever platform is missing.
        run: python spark/scripts/stage_jars.py --require-natives

      - name: Build
        working-directory: omle-runtime/spark/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the jars reached the wheel
        working-directory: omle-runtime/spark/python
        # A wheel missing them installs and imports; jars() only raises when
        # someone builds a session. Cheapest place to catch it is here.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          jars = [n for n in names if n.startswith("omle_spark/jars/")]
          for j in sorted(jars):
              print(f"  {j}")
          need = ["omle_spark/jars/omle-spark_2.12-", "omle_spark/jars/omle-spark_2.13-",
                  "omle_spark/jars/omle-runtime-", "omle_spark/jars/jna-"]
          missing = [p for p in need if not any(n.startswith(p) for n in jars)]
          if missing:
              sys.exit(f"::error::wheel is missing {missing}")
          print(f"{whl}: {len(jars)} jars present")
          PY

      - name: Check the metadata is publishable
        working-directory: omle-runtime/spark/python
        # twine check catches a malformed long_description or bad classifiers,
        # which the index rejects only at upload time.
        run: |
          pip install twine
          twine check dist/*
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-omle-spark
          path: omle-runtime/spark/python/dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Publish.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to ${{ github.event_name == 'push' && 'pypi' || inputs.index }}
    needs: dist
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.index }}
    permissions:
      # Required for Trusted Publishing: the job mints a short-lived OIDC token
      # instead of holding a long-lived API token in secrets. Configure the
      # publisher once at
      # https://pypi.org/manage/project/omle-spark/settings/publishing/
      # naming this repository, publish-spark.yml, and the environment above.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-omle-spark
          path: dist

      - run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
